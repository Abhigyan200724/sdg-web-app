<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
            overflow:hidden;
        }

        .login-card{
            width:400px;
            padding:40px;
            border-radius:20px;
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(15px);
            box-shadow:0 8px 32px rgba(0,0,0,0.2);
            color:white;
        }

        .login-card h2{
            text-align:center;
            margin-bottom:30px;
            font-weight:bold;
        }

        .form-control{
            background:rgba(255,255,255,0.2);
            border:none;
            color:white;
            height:50px;
        }

        .form-control::placeholder{
            color:#eee;
        }

        .form-control:focus{
            background:rgba(255,255,255,0.25);
            color:white;
            box-shadow:none;
        }

        .btn-login{
            width:100%;
            height:50px;
            border:none;
            border-radius:10px;
            background:white;
            color:#4facfe;
            font-weight:bold;
            transition:0.3s;
        }

        .btn-login:hover{
            background:#f1f1f1;
            transform:translateY(-2px);
        }

        .extra-links{
            text-align:center;
            margin-top:20px;
        }

        .extra-links a{
            color:white;
            text-decoration:none;
        }

        .extra-links a:hover{
            text-decoration:underline;
        }

        .floating-circle{
            position:absolute;
            border-radius:50%;
            background:rgba(255,255,255,0.15);
        }

        .circle1{
            width:200px;
            height:200px;
            top:10%;
            left:10%;
        }

        .circle2{
            width:300px;
            height:300px;
            bottom:5%;
            right:5%;
        }
    </style>
</head>
<body>
    
    <div class="floating-circle circle1"></div>
    <div class="floating-circle circle2"></div>

    <div class="login-card">
        <h2>Welcome Back</h2>

        <form id="loginForm">
            <div class="mb-3">
                <input type="email"
                       class="form-control" id="email"
                       placeholder="Enter Email"
                       required>
            </div>

            <div class="mb-3">
                <input type="password"
                       class="form-control"
                          id="password"
                       placeholder="Enter Password"
                       required>
            </div>

            <div class="d-flex justify-content-between mb-3">
                <div>
                    <input type="checkbox">
                    <label>Remember Me</label>
                </div>

                <a href="#" class="text-white text-decoration-none">
                    Forgot Password?
                </a>
            </div>

            <button type="submit" class="btn-login">
                Login
            </button>
        </form>

        <div class="extra-links">
            <p class="mt-3">
                Don't have an account?
                <a href="register.html">Register</a>
            </p>
        </div>
    </div>
<script src="js/auth.js"></script>
</body>
</html>
