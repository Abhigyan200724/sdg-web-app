<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
    background: linear-gradient(135deg,#4facfe,#00f2fe);
    min-height:100vh;
    font-family:'Segoe UI',sans-serif;
}

.contact-section{
    padding:80px 0;
}

.section-title{
    text-align:center;
    color:white;
    font-weight:bold;
    margin-bottom:50px;
}

.contact-card{
    background:white;
    border-radius:20px;
    padding:35px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.info-box{
    text-align:center;
    padding:25px;
    border-radius:15px;
    background:#f8f9fa;
    transition:.3s;
}

.info-box:hover{
    transform:translateY(-5px);
}

.info-box i{
    font-size:35px;
    color:#0d6efd;
    margin-bottom:15px;
}

.form-control{
    height:50px;
    border-radius:10px;
}

textarea.form-control{
    height:130px;
}

.btn-send{
    background:#0d6efd;
    color:white;
    border:none;
    padding:12px 30px;
    border-radius:10px;
    font-weight:600;
}

.btn-send:hover{
    background:#0b5ed7;
}

.social-icons a{
    text-decoration:none;
    color:#0d6efd;
    font-size:22px;
    margin:0 10px;
}

.map-container{
    margin-top:40px;
    border-radius:20px;
    overflow:hidden;
}
</style>

</head>
<body>

<section class="contact-section">

<div class="container">

<h1 class="section-title">Contact Us</h1>

<div class="row g-4">

<div class="col-lg-4">

<div class="info-box mb-4">
<i class="fas fa-map-marker-alt"></i>
<h5>Address</h5>
<p>Prayagraj, Uttar Pradesh, India</p>
</div>

<div class="info-box mb-4">
<i class="fas fa-phone"></i>
<h5>Phone</h5>
<p>+91 XXXXX XXXXX</p>
</div>

<div class="info-box">
<i class="fas fa-envelope"></i>
<h5>Email</h5>
<p>info@example.com</p>
</div>

</div>

<div class="col-lg-8">

<div class="contact-card">

<h3 class="mb-4">Send Message</h3>

<form>

<div class="row">

<div class="col-md-6 mb-3">
<input type="text"
class="form-control"
placeholder="Your Name"
required>
</div>

<div class="col-md-6 mb-3">
<input type="email"
class="form-control"
placeholder="Your Email"
required>
</div>

</div>

<div class="mb-3">
<input type="text"
class="form-control"
placeholder="Subject"
required>
</div>

<div class="mb-3">
<textarea class="form-control"
placeholder="Write Your Message"
required></textarea>
</div>

<button type="submit" class="btn-send">
Send Message
</button>

</form>

<hr class="my-4">

<div class="text-center social-icons">

<a href="#"><i class="fab fa-facebook"></i></a>

<a href="#"><i class="fab fa-instagram"></i></a>

<a href="#"><i class="fab fa-linkedin"></i></a>

<a href="#"><i class="fab fa-github"></i></a>

<a href="#"><i class="fab fa-youtube"></i></a>

</div>

</div>

</div>

</div>

<div class="map-container">

<iframe
src="https://maps.google.com/maps?q=Prayagraj&t=&z=13&ie=UTF8&iwloc=&output=embed"
width="100%"
height="350"
style="border:0;"
allowfullscreen=""
loading="lazy">
</iframe>

</div>

</div>

</section>

</body>
</html>
